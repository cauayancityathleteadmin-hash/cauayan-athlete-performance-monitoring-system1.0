name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: next-app

jobs:
  lint-and-build:
    name: Lint & build
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: placeholder-for-ci-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
